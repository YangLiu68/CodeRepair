name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Stock CPython image; pytest is mounted read-only from the runner bundle.
  CODEREPAIR_SANDBOX_IMAGE: python:3.12-slim

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Install (locked)
        run: uv sync --locked --all-extras --python ${{ matrix.python }}
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Pull the sandbox image (the only network use; runs use --pull never)
        run: docker pull "$CODEREPAIR_SANDBOX_IMAGE"
      - name: Sandbox status
        run: uv run coderepair sandbox status
      - name: Abuse probes in the Docker sandbox
        run: uv run coderepair sandbox selftest --sandbox docker
      - name: Unit, security, sandbox and acceptance tests (Docker backend)
        run: uv run pytest -rs
      - name: Validate fixtures and the hard tier (host, trusted) and the public subset (sandboxed)
        run: |
          uv run coderepair validate-fixtures --suite fixtures,hard
          uv run coderepair validate-fixtures --suite hard --sandbox docker
          uv run coderepair validate-fixtures --suite public --sandbox docker
      - name: Retrieval metrics
        run: uv run coderepair eval-retrieval
      - name: Harness smoke (oracle mock backend, no secrets)
        run: |
          uv run coderepair bench --backend oracle --sandbox docker --suite all \
            --tasks t01_paginate_off_by_one t10_deep_merge_injection q06_gcd h07_coupon_counts_invoices \
            --out "$RUNNER_TEMP/bench/oracle.jsonl"
          uv run coderepair repair t07_safe_join_prefix_escape --backend oracle \
            --sandbox docker --evaluate --no-save --no-color
