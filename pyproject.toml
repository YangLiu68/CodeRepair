[project]
name = "coderepair"
version = "0.1.0"
description = "Constrained, test-driven code repair agent with sandboxed evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "TBD - see LICENSE_NOTES.md" }
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]

[project.scripts]
coderepair = "coderepair.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "anthropic>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coderepair"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["benchmarks/tasks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S603"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
# The system prompt is natural-language text; wrapping it would change the prompt.
"src/coderepair/prompting.py" = ["E501"]
